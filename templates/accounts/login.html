{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="text-center mb-3 fw-bold">Login to Adwise</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">{{ form.username }}</div>
                <div class="mb-3">{{ form.password }}</div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="{% url 'register_user' %}">User Signup</a> or <a href="{% url 'expert_register_step1' %}">Register as Expert</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
